name: Application checks

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore solution
        run: dotnet restore SpazaSnap.sln
      - name: Build
        run: dotnet build SpazaSnap.sln --configuration Release --no-restore
      - name: Check browser scripts
        run: |
          node --check wwwroot/app.js
          node --check wwwroot/sw.js
      - name: Unit tests and coverage
        run: dotnet test tests/SpazaSnap.Tests/SpazaSnap.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=unit-tests.trx" --collect:"XPlat Code Coverage" --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: TestResults/
          if-no-files-found: warn

  mysql-integration:
    name: MySQL integration tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only
          MYSQL_DATABASE: spazasnap
          MYSQL_USER: spazasnap
          MYSQL_PASSWORD: ci-app-only
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      ConnectionStrings__MySql: Server=127.0.0.1;Port=3307;Database=spazasnap;User ID=spazasnap;Password=ci-app-only;Connection Timeout=10
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build application
        run: dotnet build SpazaSnap.csproj --configuration Release
      - name: Initialize schema twice
        shell: pwsh
        run: |
          dotnet bin/Release/net10.0/SpazaSnap.dll --init-db
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet bin/Release/net10.0/SpazaSnap.dll --init-db
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Start app and await readiness
        shell: bash
        run: |
          dotnet bin/Release/net10.0/SpazaSnap.dll --urls http://localhost:5038 > app.log 2>&1 &
          echo $! > app.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:5038/api/health; then exit 0; fi
            sleep 1
          done
          cat app.log
          exit 1
      - name: Exercise database and API flows
        shell: pwsh
        run: |
          ./tests/Integration.ps1
      - name: Stop app
        if: always()
        shell: bash
        run: if [ -f app.pid ]; then kill "$(cat app.pid)" || true; fi
      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-server-log
          path: app.log
          if-no-files-found: ignore

  package:
    name: Publish application artifact
    needs: [unit-tests, mysql-integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish SpazaSnap.csproj --configuration Release --output publish
      - name: Verify deployment container builds
        run: docker build --tag spazasnap:ci .
      - uses: actions/upload-artifact@v4
        with:
          name: SpazaSnap-app
          path: publish/
          retention-days: 14
